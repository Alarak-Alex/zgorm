name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zgorm
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: zgorm_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U zgorm -d zgorm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: zgorm
          MYSQL_USER: zgorm
          MYSQL_PASSWORD: ${{ github.run_id }}
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZORM_DSN: postgres://zgorm:${{ github.run_id }}@127.0.0.1:5432/zgorm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src tests example

      - name: Unit tests
        run: zig build test --summary all

      - name: Driver tests (SQLite and MySQL)
        run: zig build test-drivers -Dmysql-port=3306 -Dmysql-password="$GITHUB_RUN_ID" --summary all

      - name: Integration tests (PostgreSQL)
        run: |
          : "${ZORM_DSN:?PostgreSQL DSN is required}"
          zig build test-integration --summary all

      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Arena example (live PostgreSQL)
        run: zig build run-arena
